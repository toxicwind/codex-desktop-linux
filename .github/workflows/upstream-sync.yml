name: Upstream Sync
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/codex-team/codex.desktop.git || true
          git fetch upstream

      - name: Merge upstream
        run: |
          git checkout ${{ github.event.repository.default_branch }}
          git merge upstream/${{ github.event.repository.default_branch }} --no-edit || true

      - name: Push
        run: git push origin ${{ github.event.repository.default_branch }}
